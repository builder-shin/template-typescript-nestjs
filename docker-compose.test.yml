name: template-typescript-nestjs-test

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nestjs_template_test
      POSTGRES_USER: nestjs
      POSTGRES_PASSWORD: nestjs
    ports:
      - target: 5432
        published: '${TEST_DB_PORT:-55432}'
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      # postgres 18+ 이미지는 PGDATA를 `/var/lib/postgresql/18/docker`에 두고
      # `VOLUME /var/lib/postgresql`을 선언한다. 따라서 마운트는 이 부모 경로 하나여야
      # 한다. postgres 17까지의 관례대로 `/var/lib/postgresql/data`에 걸면 이미지가
      # "unused mount/volume"으로 판단해 기동을 거부한다(exit 1).
      # 참고: https://github.com/docker-library/postgres/pull/1259
      - test_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestjs -d nestjs_template_test']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis:
    image: redis:8-alpine
    ports:
      - target: 6379
        published: '${TEST_REDIS_PORT:-56379}'
        host_ip: 127.0.0.1
        protocol: tcp
    # 볼륨을 두지 않는다 — 테스트 Redis는 실행마다 새로 시작해도 되는 상태만 갖고,
    # 볼륨을 두면 정리할 것이 하나 더 늘 뿐이다(db가 마이그레이션 재적용 비용 때문에
    # 볼륨을 두는 것과 대비된다).
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  test_postgres_data:
