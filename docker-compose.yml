services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nestjs_template}
      POSTGRES_USER: ${POSTGRES_USER:-nestjs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nestjs}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # postgres 18+ 이미지는 PGDATA를 `/var/lib/postgresql/18/docker`에 두고
      # `VOLUME /var/lib/postgresql`을 선언한다. 따라서 마운트는 이 부모 경로 하나여야
      # 한다. postgres 17까지의 관례대로 `/var/lib/postgresql/data`에 걸면 이미지가
      # "unused mount/volume"으로 판단해 기동을 거부한다(exit 1).
      # 참고: https://github.com/docker-library/postgres/pull/1259
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nestjs} -d ${POSTGRES_DB:-nestjs_template}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # 스키마를 head까지 올리고 끝나는 일회성 서비스. `api`/`worker`가
  # `service_completed_successfully`로 이것을 기다리므로, 스택이 뜨는 순간 스키마는
  # 이미 최신이다.
  #
  # **왜 애플리케이션이 직접 하지 않는가**: `migrationsRun`은 운영과 같이 `false`다.
  # 부팅 시 마이그레이션은 복제본이 둘 이상이면 서로 경합하고, 배포 단계가 소유해야
  # 할 일을 애플리케이션 수명주기에 묶는다. 일회성 서비스로 빼면 그 두 문제가 모두
  # 없다 — Compose가 순서를 보장하고, 실행 주체는 여전히 배포 쪽이다.
  #
  # 이미지에 pnpm이 없으므로(runtime 단계는 프로덕션 의존성만 담는다) `pnpm migrate`가
  # 아니라 TypeORM CLI를 직접 부른다 — `package.json`의 `migrate` 스크립트와 같은
  # 명령이고, 진입점만 pnpm을 거치지 않을 뿐이다.
  migrate:
    build: .
    command:
      ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', 'dist/config/data-source.js']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-nestjs}@db:5432/${POSTGRES_DB:-nestjs_template}
    # 한 번 돌고 끝나는 것이 정상이다 — 재시작하면 이미 적용된 마이그레이션을 계속
    # 다시 확인할 뿐이고, `--wait`가 기다리는 "정상 종료"에 영영 도달하지 못한다.
    restart: 'no'

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: ${PORT:-4000}
      DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-nestjs}@db:5432/${POSTGRES_DB:-nestjs_template}
      # 더미 기본값입니다 — 운영에서는 반드시 실제 `.env`의 JWT_SECRET_KEY로 덮어써야
      # 합니다. `.env.example`의 경고와 같은 값입니다.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-jwt-secret-do-not-use-in-prod}
    ports:
      - '${PORT:-4000}:${PORT:-4000}'

  worker:
    build: .
    # 같은 이미지를 쓰되 CMD를 워커 진입점으로 바꾼다 — Dockerfile의 기본 CMD는 API를
    # 띄운다(`node dist/config/main.js`).
    command: ['node', 'dist/app/jobs/worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-nestjs}@db:5432/${POSTGRES_DB:-nestjs_template}
      REDIS_URL: redis://redis:6379
    # 워커는 HTTP를 듣지 않는다 — 포트를 게시하지 않는다. Dockerfile의 HEALTHCHECK는
    # API의 /health/ready를 확인하는데 워커 컨테이너엔 그 엔드포인트가 없어 그대로
    # 물려받으면 항상 실패한다 — 그러면 `docker compose up --wait`가 워커를 영원히
    # unhealthy로 보고 멈춘다.
    #
    # 그렇다고 `healthcheck: disable: true`로 꺼 두면 이번엔 Compose 버전에 따라
    # 갈린다. 새 버전(로컬 실측 v5.3.1)은 헬스체크 없는 서비스를 "running"만 보고
    # 넘어가지만, GitHub Actions 러너의 버전은 `container ... has no healthcheck
    # configured`를 내고 exit 1로 죽는다(실측: 나머지 세 서비스가 전부 healthy가 된
    # 뒤 이 한 줄만 찍고 실패). 끄는 것으로는 두 버전을 모두 만족시킬 수 없으므로,
    # 워커에 맞는 헬스체크를 따로 준다.
    #
    # **무엇을 보고 무엇을 못 보는가**: 이 컨테이너에서 `REDIS_URL`이 가리키는
    # Redis에 실제로 연결되고 PING이 오가는지를 본다. 워커가 잡을 실제로 소비하고
    # 있는지는 보지 못한다 — 이벤트 루프가 막힌 워커도 이 검사는 통과한다. 반대로
    # 프로세스가 죽는 경우는 컨테이너가 종료되므로 Docker가 이미 잡는다. 이 검사가
    # 더하는 것은 그 사이, 즉 "프로세스는 살아 있는데 브로커에 못 닿는" 상태다 —
    # 워커에게는 그것이 곧 아무 일도 하지 못하는 상태다.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const module_ = require('ioredis');
          const Redis = module_.default ?? module_;
          const client = new Redis(process.env.REDIS_URL, {
            lazyConnect: true,
            retryStrategy: () => null,
          });
          const done = (code) => {
            client.disconnect();
            process.exit(code);
          };
          client.on('error', () => {});
          client
            .connect()
            .then(() => client.ping())
            .then(() => { done(0); })
            .catch(() => { done(1); });
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
